<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>SpanishProGamers V2</title>
  
  <style>
    :root {
      --pink: #cc1a1a;
      --pink-light: #e02020;
      --nav-h: 99px;
      --gap: 20px;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
    }

    body {
      background: #0d0d0d;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── NAVBAR CORREGIDA ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      /* Se eleva el z-index según el estándar de Rockstar para evitar solapamientos */
      z-index: 400; 
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* Ajuste para áreas seguras de iPhone (Notch) */
      padding: 0 calc(4rem + env(safe-area-inset-right)) 0 calc(4rem + env(safe-area-inset-left));
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
    }

    /* ── CONTENIDO PRINCIPAL ── */
    /* Se añade posición relativa y z-index bajo para forzar el orden de apilado */
    main {
      position: relative;
      z-index: 1;
      padding-top: var(--nav-h);
    }

    .hero {
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #1a1a1a, #0d0d0d);
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">SpanishProGamers</div>
    <div class="menu">Menu</div>
  </nav>

  <main>
    <section class="hero">
      <h1>Bienvenido a la nueva experiencia</h1>
    </section>
    <section style="padding: 100px 20px; height: 200vh;">
      <p>Al hacer scroll, este contenido pasará ahora SIEMPRE por debajo de la barra de navegación.</p>
    </section>
  </main>

</body>
</html>
