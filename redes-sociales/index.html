    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; padding: 0 4rem; background: transparent; transition: background 0.35s ease, backdrop-filter 0.35s ease, transform 0.4s ease; }
    nav.scrolled { background: rgba(0,0,0,0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    nav.hidden { transform: translateY(calc(-100% - 10px)); pointer-events: none; }

    .nav-link { font-family: 'FoundersGrotesk', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.9); text-decoration: none; padding: 0.55rem 1.1rem; display: flex; align-items: center; gap: 0.25rem; transition: color 0.18s, background 0.18s; white-space: nowrap; border-radius: 999px; }

    .nav-right { display: flex; align-items: center; gap: 0.8rem; }
    .nav-btn-outline { font-family: 'FoundersGrotesk', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; color: rgba(255,255,255,0.9); text-decoration: none; padding: 0.55rem 1.1rem; border: 1.5px solid rgba(255,255,255,0.45); border-radius: 999px; white-space: nowrap; transition: border-color 0.18s, color 0.18s; }
    .nav-btn-outline:hover { border-color: #fff; color: #fff; }
    .nav-icon-btn { background: none; border: none; color: rgba(255,255,255,0.85); cursor: pointer; padding: 0.4rem; display: flex; align-items: center; transition: color 0.2s; }
    .nav-icon-btn:hover { color: #fff; }
    @media (max-width: 860px) { .nav-center { display: none; } }
    main { flex: 1; padding-top: var(--nav-h); display: flex; align-items: center; justify-content: center; }

  </div>  <script>
    const nav = document.querySelector('nav');
    const hoverZone = document.getElementById('nav-hover-zone');
    let isHovering = false;
    // En páginas sin hero la navbar arranca siempre translúcida (estado 1)
    // 1 = translúcida | 2 = oculta
    let navState = 1;
    let transitionY = null;
    let hiddenY = null;
    const HIDE_AFTER_PX = 120;

    nav.classList.add('scrolled');

    function applyState(s) {
      navState = s;
      if (s === 1) {
        nav.classList.add('scrolled');
        nav.classList.remove('hidden');
      } else {
        nav.classList.add('scrolled');
        if (!isHovering) nav.classList.add('hidden');
      }
    }

    // wheel: primer gesto hacia abajo marca transitionY
    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 0 && navState === 1 && transitionY === null) {
        transitionY = window.scrollY;
      } else if (e.deltaY < 0 && navState === 2) {
        applyState(1);
        transitionY = window.scrollY;
        hiddenY = null;
      }
    }, { passive: true });

    // scroll: gestiona ocultado y reaparición
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      if (y <= 0) {
        navState = 1; transitionY = null; hiddenY = null;
        nav.classList.add('scrolled'); nav.classList.remove('hidden');
        return;
      }
      if (navState === 1 && transitionY !== null && y >= transitionY + HIDE_AFTER_PX) {
        hiddenY = y; applyState(2);
      }
      if (navState === 2 && hiddenY !== null && y < hiddenY) {
        hiddenY = null; transitionY = y; applyState(1);
      }
    }, { passive: true });

    hoverZone.addEventListener('mouseenter', () => { isHovering = true; nav.classList.remove('hidden'); });
    nav.addEventListener('mouseenter',       () => { isHovering = true; nav.classList.remove('hidden'); });
    nav.addEventListener('mouseleave',       () => { isHovering = false; if (navState === 2) nav.classList.add('hidden'); });
    hoverZone.addEventListener('mouseleave', () => { isHovering = false; if (navState === 2) nav.classList.add('hidden'); });
  </script></body>
