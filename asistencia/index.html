<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Asistencia - SpanishProGamers</title>
  <!-- Icono para navegadores de escritorio y compatibles -->
  <link rel="icon" href="/favicon.png" type="image/x-icon">

  <!-- Iconos para dispositivos móviles (iOS y Android) -->
  <link rel="apple-touch-icon" sizes="512x512" href="/AppLogo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/AppLogo.png">

  <!-- Web App: pantalla completa y barra de estado negra en iOS (todos los modelos) -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#000000"/>

  <style>  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    :root { --pink: #cc1a1a; --pink-light: #e02020; --nav-h: 99px; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #ffffff; color: #000; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── NAVBAR ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 400;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 calc(4rem + env(safe-area-inset-right)) 0 calc(4rem + env(safe-area-inset-left));
      background: transparent;
      transition: background 0.35s ease, backdrop-filter 0.35s ease, transform 0.4s ease;
    }
    nav.scrolled {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    nav.hidden {
      transform: translateY(calc(-100% - 10px));
      pointer-events: none;
    }

    /* Zona invisible en la parte superior que reactiva la navbar */
    #nav-hover-zone {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 20px;
      z-index: 201;
      pointer-events: all;
    }
    .nav-logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .nav-logo .logo-desktop { display: block; }
    .nav-logo .logo-mobile  { display: none; }
    @media (max-width: 1050px) {
      .nav-logo .logo-desktop { display: none; }
      .nav-logo .logo-mobile  { display: block; }
    }
    .nav-center {
      display: flex; align-items: center; gap: 0.1rem;
      position: absolute; left: 50%; transform: translateX(-50%);
    }
    .nav-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: rgba(255,255,255,0.9);
      text-decoration: none; padding: 0.55rem 1.1rem;
      display: flex; align-items: center; gap: 0.25rem;
      transition: color 0.18s, background 0.18s;
      white-space: nowrap; border-radius: 999px;
    }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.15); }
    .nav-link.active { color: #fff; background: rgba(255,255,255,0.12); }
    .nav-link .ext { font-size: 0.75em; opacity: 0.7; }
    .nav-right { display: flex; align-items: center; gap: 0.8rem; }
    .nav-btn-outline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      padding: 0.55rem 1.1rem;
      border: 1.5px solid rgba(255,255,255,0.45);
      border-radius: 999px;
      white-space: nowrap;
      transition: border-color 0.18s, color 0.18s;
    }
    .nav-btn-outline:hover { border-color: #fff; color: #fff; }
    .nav-icon-btn {
      background: none; border: none; color: rgba(255,255,255,0.85);
      cursor: pointer; padding: 0.4rem; display: flex; align-items: center; transition: color 0.2s;
    }
    .nav-icon-btn:hover { color: #fff; }

    /* Ocultar botón Obtener Asistencia cuando empieza a solaparse con los links centrales */
    @media (max-width: 1250px) and (min-width: 1051px) { .nav-btn-outline { display: none; } }

    /* ── HAMBURGER MENU ── */
    .nav-hamburger {
      display: none;
      background: none; border: none;
      color: rgba(255,255,255,0.9);
      cursor: pointer; padding: 0.4rem;
      align-items: center; justify-content: center;
      width: 28px; height: 28px;
      position: relative;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .nav-hamburger:hover { color: #fff; }
    .nav-hamburger span {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      width: 14px; height: 2px;
      background: currentColor; border-radius: 1px;
      transition: transform 0.25s ease, opacity 0.15s ease;
    }
    .nav-hamburger span:nth-child(1) { top: calc(50% - 5px); transform: translateX(-50%); }
    .nav-hamburger span:nth-child(2) { top: calc(50% - 1px); transform: translateX(-50%); }
    .nav-hamburger span:nth-child(3) { top: calc(50% + 3px); transform: translateX(-50%); }
    .nav-hamburger.open span:nth-child(1) { transform: translateX(-50%) translateY(4px); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: translateX(-50%); transition: transform 0s, opacity 0.15s ease 0.2s; }
    .nav-hamburger.open span:nth-child(3) { transform: translateX(-50%) translateY(-4px); }

    /* Overlay */
    .nav-overlay { display: none !important; }

    /* Panel desplegable — full screen, animación desde arriba */
    .nav-dropdown {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100vh;
      z-index: 199;
      background: #000;
      padding-top: 80px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      transform: translateY(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .nav-dropdown.open { transform: translateY(0); }
    .nav-dropdown::-webkit-scrollbar { width: 3px; }
    .nav-dropdown::-webkit-scrollbar-track { background: transparent; }
    .nav-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }
    .nav-dropdown::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    /* Navbar bar when menu open */
    nav.menu-open {
      background: #222222 !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      z-index: 200 !important;
    }

    .dd-section-label { display: none; }

    .nav-dropdown a {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.35rem; font-weight: 800; letter-spacing: 0.01em;
      text-transform: uppercase;
      color: #cecece;
      text-decoration: none;
      padding: 1.1rem 1.8rem;
      display: flex; align-items: center; justify-content: space-between;
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .nav-dropdown a:first-of-type { border: none; }
    .nav-dropdown a:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-dropdown a.active { color: #fff; }

    .dd-icon { display: none; }
    .dd-label { flex: 1; }
    .dd-arrow { color: #cecece; font-size: 18px; font-weight: 400; opacity: 0.5; }
    .dd-divider { display: none; }

    /* Assist CTA button */
    .nav-dropdown .dd-assist {
      margin: 1.5rem 1.8rem 0 !important;
      padding: 1rem 1.5rem !important;
      background: transparent !important;
      border: 1.5px solid #cecece !important;
      border-top: 1.5px solid #cecece !important;
      border-bottom: 1.5px solid #cecece !important;
      border-radius: 999px !important;
      justify-content: center !important;
      font-size: 1rem; font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff !important;
      text-transform: uppercase;
      transition: background 0.15s, border-color 0.15s !important;
    }
    .nav-dropdown .dd-assist:hover { background: rgba(255,255,255,0.07) !important; border-color: #fff !important; }

    /* Mobile nav layout */
    @media (max-width: 1050px) {
      nav {
        padding: env(safe-area-inset-top) calc(1.25rem + env(safe-area-inset-right)) 0 calc(1.25rem + env(safe-area-inset-left));
        height: calc(80px + env(safe-area-inset-top));
      }
      .nav-hamburger { display: flex; width: 34px; height: 34px; margin-bottom: 2px; }
      .nav-hamburger span { width: 16px; }
      .nav-center { display: none; }
      .nav-logo {
        position: absolute;
        left: 50%;
        transform: translateX(-50%) translateY(-2px);
      }
      .nav-logo .logo-mobile { height: 61px !important; width: 61px !important; border-radius: 13px !important; }
      .nav-btn-outline { display: none; }
      .nav-spacer { display: none; }
      .nav-icon-btn { margin-bottom: 2px; }
      .nav-icon-btn svg { width: 16px !important; height: 16px !important; }
      :root { --nav-h: calc(80px + env(safe-area-inset-top)); }
      .nav-dropdown { padding-top: calc(80px + env(safe-area-inset-top)); }
    }
    @media (min-width: 1051px) {
      .nav-spacer { display: none; }
      .nav-dropdown { display: none !important; }
    }

    main { flex: 1; display: flex; flex-direction: column; min-height: calc(100vh + 200px); }
    .form-wrap {
      flex: 1;
      margin-top: calc(var(--nav-h) + 4rem);
      margin-bottom: 53px;
    }
    .form-wrap iframe {
      width: 100%;
      height: calc(100vh - var(--nav-h) - 4rem - 53px);
      display: block;
      border: none;
      overflow: hidden;
    }
    .footer-bottom-bar { background: #fff; padding: 1rem calc(4rem + 1px); display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; }
    .footer-bottom-bar span { font-size: 13px; color: rgba(0,0,0,0.55); letter-spacing: 0.05em; }
    .footer-bottom-bar span:nth-child(2) { text-align: center; }
    .footer-bottom-bar span:nth-child(3) { text-align: right; }
    @media (max-width: 600px) {
      .footer-bottom-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="nav-hover-zone"></div>

  <!-- NAVBAR -->
  <nav class="scrolled">
    <!-- Hamburger (visible solo en móvil) -->
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>

    <a href="/" class="nav-logo" title="Inicio">
      <img class="logo-desktop" src="/Zassets/icono_esqunas_redondeadas.png" alt="SPG" style="height:47px;width:47px;border-radius:10px;object-fit:cover;"/>
      <img class="logo-mobile"  src="/Zassets/icono_web_app.png" alt="SPG" style="object-fit:contain;"/>
    </a>
    <div class="nav-center">
      <a href="/" class="nav-link">Inicio</a>
      <a href="/servidores/" class="nav-link">Servidores</a>
      <a href="/archivo/" class="nav-link">Archivo</a>
      <a href="/redes-sociales/" class="nav-link">Redes Sociales</a>
      <a href="/wiki/" class="nav-link">Wiki</a>
      <a href="https://discord.com/invite/WaSdGkwMrm" target="_blank" rel="noopener" class="nav-link">Discord <span class="ext">↗</span></a>
    </div>
    <div class="nav-right">
      <a href="/asistencia/" class="nav-btn-outline">Obtener Asistencia</a>
      <button class="nav-icon-btn" aria-label="Buscar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>

    <!-- Spacer para centrar el logo en móvil -->
    <div class="nav-spacer"></div>
  </nav>

  <!-- Overlay móvil -->
  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- Panel desplegable móvil -->
  <div class="nav-dropdown" id="nav-dropdown">
    <div class="dd-section-label">Navegación</div>
    <a href="/">
      <span class="dd-label">Inicio</span>
    </a>
    <a href="/servidores/">
      <span class="dd-label">Servidores</span>
    </a>
    <a href="/archivo/">
      <span class="dd-label">Archivo</span>
    </a>
    <a href="/redes-sociales/">
      <span class="dd-label">Redes Sociales</span>
    </a>
    <a href="/wiki/">
      <span class="dd-label">Wiki</span>
    </a>
    <div class="dd-divider"></div>
    <a href="https://discord.com/invite/WaSdGkwMrm" target="_blank" rel="noopener">
      <span class="dd-label">Discord</span>
      <span class="dd-arrow">›</span>
    </a>
    <a href="/asistencia/" class="dd-assist">
      Obtener Asistencia
    </a>
  </div>

  <main>
    <div class="form-wrap">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSc9FQa3E4LCJQM1K8pzgSo6Cbtk9Q6LNExVAeQ0RWCt22QSCQ/viewform?embedded=true"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
      >Cargando…</iframe>
    </div>
  </main>
  <div class="footer-bottom-bar">
    <span>SpanishProGamers</span>
    <span>Madrid</span>
    <span>MMXIX</span>
  </div>

  <script>
    // ── HAMBURGER TOGGLE ──
    const hamburger = document.getElementById('nav-hamburger');
    const dropdown  = document.getElementById('nav-dropdown');
    const overlay   = document.getElementById('nav-overlay');
    const nav       = document.querySelector('nav');

    function openMenu() {
      dropdown.classList.add('open');
      hamburger.classList.add('open');
      nav.classList.add('scrolled');
      nav.classList.add('menu-open');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      dropdown.classList.remove('open');
      hamburger.classList.remove('open');
      nav.classList.remove('menu-open');
      document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', function(e) {
      e.stopPropagation();
      dropdown.classList.contains('open') ? closeMenu() : openMenu();
    });

    overlay.addEventListener('click', closeMenu);

    dropdown.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', closeMenu);
    });

    // ── NAV SCROLL LOGIC ──
    const hoverZone = document.getElementById('nav-hover-zone');
    let isHovering = false;
    // 0 = transparente | 1 = translúcida | 2 = oculta
    let navState = 0;
    let transitionY = null;
    const HIDE_AFTER_PX = 120;
    let hiddenY = null;

    function applyState(s) {
      navState = s;
      // Never hide navbar while the side menu is open
      if (dropdown.classList.contains('open')) {
        nav.classList.add('scrolled');
        nav.classList.remove('hidden');
        return;
      }
      if (s === 0) {
        nav.classList.remove('scrolled', 'hidden');
      } else if (s === 1) {
        nav.classList.add('scrolled');
        nav.classList.remove('hidden');
      } else {
        nav.classList.add('scrolled');
        if (!isHovering) nav.classList.add('hidden');
      }
    }

    const isMobile = () => window.innerWidth <= 1050;

    // wheel: solo gestiona el paso 0→1 — SOLO DESKTOP
    window.addEventListener('wheel', (e) => {
      if (isMobile()) return;
      if (e.deltaY > 0 && navState === 0) {
        transitionY = window.scrollY;
        applyState(1);
      } else if (e.deltaY > 0 && navState === 1 && transitionY === null) {
        transitionY = window.scrollY - HIDE_AFTER_PX;
      } else if (e.deltaY < 0) {
        if (window.scrollY <= 0) { transitionY = null; applyState(0); }
        else if (navState !== 1)  { applyState(1); transitionY = null; }
      }
    }, { passive: true });

    // scroll: en móvil siempre translúcida y visible; en desktop gestiona ocultar/mostrar
    window.addEventListener('scroll', () => {
      const y = window.scrollY;

      // MÓVIL: navbar siempre scrolled y nunca hidden
      if (isMobile()) {
        if (y <= 0) {
          nav.classList.remove('scrolled', 'hidden');
        } else {
          nav.classList.add('scrolled');
          nav.classList.remove('hidden');
        }
        return;
      }

      // DESKTOP
      if (y <= 0) {
        transitionY = null;
        applyState(0);
        return;
      }
      if (navState === 1 && transitionY !== null && y >= transitionY + HIDE_AFTER_PX) {
        hiddenY = y;
        applyState(2);
      }
      if (navState === 2 && hiddenY !== null && y < hiddenY) {
        hiddenY = null;
        transitionY = null;
        applyState(1);
      }
    }, { passive: true });

    hoverZone.addEventListener('mouseenter', () => { isHovering = true; nav.classList.remove('hidden'); });
    nav.addEventListener('mouseenter',       () => { isHovering = true; nav.classList.remove('hidden'); });
    nav.addEventListener('mouseleave',       () => { isHovering = false; if (navState === 2) nav.classList.add('hidden'); });
    hoverZone.addEventListener('mouseleave', () => { isHovering = false; if (navState === 2) nav.classList.add('hidden'); });
  </script>
</body>
</html>
